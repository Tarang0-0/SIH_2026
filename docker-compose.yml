services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: railtrackr-backend
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      # Supply this at deploy time; do not commit the secret.
      - INDIAN_RAIL_API_KEY=${INDIAN_RAIL_API_KEY:-}
      - INDIAN_RAIL_API_BASE_URL=${INDIAN_RAIL_API_BASE_URL:-}
      - RAILRADAR_API_KEY=${RAILRADAR_API_KEY:-}
      - RAILRADAR_API_BASE_URL=${RAILRADAR_API_BASE_URL:-}
      - OFFICIAL_RAIL_STATUS_URL=${OFFICIAL_RAIL_STATUS_URL:-}
      - OFFICIAL_RAIL_STATUS_TOKEN=${OFFICIAL_RAIL_STATUS_TOKEN:-}
      - OFFICIAL_RAIL_STATUS_POLL_SECONDS=${OFFICIAL_RAIL_STATUS_POLL_SECONDS:-30}
      - OFFICIAL_RAIL_STATUS_MAX_AGE_SECONDS=${OFFICIAL_RAIL_STATUS_MAX_AGE_SECONDS:-300}
      - OPENWEATHER_API_KEY=${OPENWEATHER_API_KEY:-}
      - OPENWEATHER_API_URL=${OPENWEATHER_API_URL:-}
      - OPENWEATHER_CACHE_SECONDS=${OPENWEATHER_CACHE_SECONDS:-900}
      - RAIL_NETWORK_SIGNALS_URL=${RAIL_NETWORK_SIGNALS_URL:-}
      - RAIL_NETWORK_SIGNALS_PROVIDER=${RAIL_NETWORK_SIGNALS_PROVIDER:-}
      - RAIL_NETWORK_SIGNALS_TOKEN=${RAIL_NETWORK_SIGNALS_TOKEN:-}
      - RAIL_NETWORK_SIGNALS_ALLOW_HTTP=${RAIL_NETWORK_SIGNALS_ALLOW_HTTP:-false}
      - RAILPULSE_FEEDBACK_DB=${RAILPULSE_FEEDBACK_DB:-/app/data/railpulse_feedback.sqlite3}
      - RAILPULSE_MODEL_REGISTRY=${RAILPULSE_MODEL_REGISTRY:-/app/models/model_registry.json}
      - RAILPULSE_DAILY_COLLECT=${RAILPULSE_DAILY_COLLECT:-false}
      - RAILPULSE_DAILY_TRAIN_NUMBERS=${RAILPULSE_DAILY_TRAIN_NUMBERS:-}
      - RAILPULSE_DAILY_COLLECTION_INTERVAL_SECONDS=${RAILPULSE_DAILY_COLLECTION_INTERVAL_SECONDS:-300}
      - RAILPULSE_DAILY_COLLECTION_SECONDS=${RAILPULSE_DAILY_COLLECTION_SECONDS:-3600}
      - RAILPULSE_ADMIN_TOKEN=${RAILPULSE_ADMIN_TOKEN:-}
      - RAILPULSE_ADMIN_USERNAME=${RAILPULSE_ADMIN_USERNAME:-}
      - RAILPULSE_ADMIN_PASSWORD=${RAILPULSE_ADMIN_PASSWORD:-}
      - CORS_ALLOW_ORIGINS=${CORS_ALLOW_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      - RATE_LIMIT_TRUST_PROXY_HEADERS=${RATE_LIMIT_TRUST_PROXY_HEADERS:-false}
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./reports:/app/reports
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: railtrackr-frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      # This value is consumed by browser-side code, where the Docker service
      # hostname is not resolvable. Override it for a remote deployment.
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://127.0.0.1:8000}
      - NEXT_PUBLIC_LEAFLET_CSS_URL=${NEXT_PUBLIC_LEAFLET_CSS_URL:-https://unpkg.com/leaflet@1.9.4/dist/leaflet.css}
      - NEXT_PUBLIC_LEAFLET_SCRIPT_URL=${NEXT_PUBLIC_LEAFLET_SCRIPT_URL:-https://unpkg.com/leaflet@1.9.4/dist/leaflet.js}
      - NEXT_PUBLIC_MAP_TILE_URL=${NEXT_PUBLIC_MAP_TILE_URL:-https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png}
      - NEXT_PUBLIC_MAP_TILE_ATTRIBUTION=${NEXT_PUBLIC_MAP_TILE_ATTRIBUTION:-&copy; OpenStreetMap contributors}
      - NEXT_PUBLIC_RAILWAY_TILE_URL=${NEXT_PUBLIC_RAILWAY_TILE_URL:-https://{s}.tiles.openrailwaymap.org/standard/{z}/{x}/{y}.png}
      - NEXT_PUBLIC_RAILWAY_TILE_ATTRIBUTION=${NEXT_PUBLIC_RAILWAY_TILE_ATTRIBUTION:-&copy; OpenRailwayMap contributors}
      - NEXT_PUBLIC_MAP_SEARCH_URL=${NEXT_PUBLIC_MAP_SEARCH_URL:-https://www.google.com/maps/search/?api=1&query=}
    depends_on:
      - backend
    restart: unless-stopped
