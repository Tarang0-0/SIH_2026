# ==============================================================================
# RailETA — Production Docker Compose Orchestration
# Problem Statement 26028: Dynamic Forecast of ETA for Coaching Trains
# ==============================================================================

version: "3.9"

services:
  # FastAPI ML & Telemetry Ingestion Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: raileta-backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DATA_SOURCE_MODE=${DATA_SOURCE_MODE:-REAL}
      - RAILRADAR_API_KEY=${RAILRADAR_API_KEY:-}
      - MAPTILER_API_KEY=${MAPTILER_API_KEY:-}
      - OPENWEATHER_API_KEY=${OPENWEATHER_API_KEY:-}
      - OPENTOPOGRAPHY_API_KEY=${OPENTOPOGRAPHY_API_KEY:-}
      - SUPABASE_URL=${SUPABASE_URL:-}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY:-}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - raileta-net

  # Next.js App Router Web Interface
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: raileta-frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://backend:8000
      - NEXT_PUBLIC_WS_URL=ws://backend:8000
      - NEXT_PUBLIC_MAPTILER_KEY=${MAPTILER_API_KEY:-}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - raileta-net

networks:
  raileta-net:
    driver: bridge
